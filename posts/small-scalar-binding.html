    <script>
      // Theme toggle
      const t = document.querySelector(".theme-toggle"),
        h = document.documentElement,
        l = document.querySelector(".theme-toggle-light"),
        d = document.querySelector(".theme-toggle-dark"),
        s =
          localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme:dark)").matches
            ? "dark"
            : "light");

      h.setAttribute("data-theme", s);
      s === "dark"
        ? ((l.style.display = "none"), (d.style.display = "block"))
        : ((l.style.display = "block"), (d.style.display = "none"));

      t.onclick = () => {
        const n = h.getAttribute("data-theme") === "dark" ? "light" : "dark";
        h.setAttribute("data-theme", n);
        localStorage.setItem("theme", n);
        n === "dark"
          ? ((l.style.display = "none"), (d.style.display = "block"))
          : ((l.style.display = "block"), (d.style.display = "none"));
      };

      // Mobile menu toggle
      document.querySelector(".menu-toggle").onclick = () =>
        document.querySelector(".nav-group").classList.toggle("is-active");

      // Auto-highlight current page
      (function () {
        const path = window.location.pathname;
        const page = path.split("/").pop() || "index.html";
        document.querySelectorAll(".main-nav a").forEach((link) => {
          const href = link.getAttribute("href").replace("../", "");
          if (
            href === page ||
            (page === "index.html" && href === "index.html")
          ) {
            link.classList.add("active");
          }
        });
      })();

      // Citation tooltips
      document.addEventListener("DOMContentLoaded", function () {
        const refs = document.querySelector("#refs");
        if (!refs) return;

        document
          .querySelectorAll('.citation a[href^="#ref-"]')
          .forEach(function (cite) {
            const refId = cite.getAttribute("href").substring(1);
            const refItem = document.getElementById(refId);

            if (refItem) {
              const urlLink = refItem.querySelector('a[href^="http"]');
              if (urlLink) {
                cite.addEventListener("click", function (e) {
                  e.preventDefault();
                  window.open(urlLink.href, "_blank");
                });
                cite.style.cursor = "pointer";
                cite.title = "Click to open source";
              }

              const tooltip = document.createElement("div");
              tooltip.className = "citation-tooltip";
              const cslEntry = refItem.querySelector(".csl-entry");
              tooltip.textContent = cslEntry
                ? cslEntry.textContent
                : refItem.textContent;
              document.body.appendChild(tooltip);

              cite.addEventListener("mouseenter", function (e) {
                const rect = cite.getBoundingClientRect();
                tooltip.style.display = "block";
                tooltip.style.left =
                  Math.min(rect.left, window.innerWidth - 420) + "px";
                tooltip.style.top = rect.bottom + 5 + "px";
              });

              cite.addEventListener("mouseleave", function () {
                tooltip.style.display = "none";
              });
            }
          });
      });

      // Add copy buttons to code blocks
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".highlight").forEach(function (block) {
          // Create copy button
          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.textContent = "Copy";
          btn.setAttribute("aria-label", "Copy code to clipboard");

          // Insert button as first child of highlight div
          block.insertBefore(btn, block.firstChild);

          const code = block.querySelector("pre");

          btn.addEventListener("click", async function () {
            const text = code.textContent;

            try {
              await navigator.clipboard.writeText(text);
              btn.textContent = "Copied!";
              btn.style.background = "#10b981";

              setTimeout(() => {
                btn.textContent = "Copy";
                btn.style.background = "";
              }, 2000);
            } catch (err) {
              // Fallback for older browsers
              const textarea = document.createElement("textarea");
              textarea.value = text;
              textarea.style.position = "fixed";
              textarea.style.opacity = "0";
              document.body.appendChild(textarea);
              textarea.select();
              document.execCommand("copy");
              document.body.removeChild(textarea);

              btn.textContent = "Copied!";
              setTimeout(() => {
                btn.textContent = "Copy";
              }, 2000);
            }
          });
        });
      });

      // Add data-tag to category tags
      document.querySelectorAll(".category-tag").forEach((tag) => {
        const tagName = tag.textContent.trim().toLowerCase();
        tag.setAttribute("data-tag", tagName);
      });

      // Extract authors and create author tags
      const authorSpan = document.querySelector(
        '.article-meta span:has-text("By")',
      );
      if (authorSpan) {
        const authorText = authorSpan.textContent.replace("By ", "").trim();
        const authors = authorText.split(",").map((a) => a.trim());

        authors.forEach((author) => {
          const tag = document.createElement("span");
          tag.className = "category-tag";
          tag.textContent = author;
          tag.setAttribute("data-tag", author.toLowerCase());
          authorSpan.parentElement.appendChild(tag);
        });
      }
    </script>
