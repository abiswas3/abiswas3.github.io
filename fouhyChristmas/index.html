<!doctype html>

<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <title>Christmas Poems</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/img/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/img/apple-touch-icon.png"
    />

    <style>
      /* ------------------ Light Mode ------------------ */
      body {
        --primary-color: #4f6cb8; /* main accent */
        --primary-pale-color: #4f6cb822; /* subtle accent */
        --primary-decoration-color: #4f6cb811; /* very subtle */
        --bg-color: #ffffff;
        --text-color: #1f1f1f;
        --text-pale-color: #6b6b6b;
        --text-decoration-color: #b0b0b0;
        --highlight-mark-color: #a1b0db20;

        --callout-note-color: #4f6cb8; /* blue */
        --callout-tip-color: #2e8555; /* green */
        --callout-important-color: #8c4fc9; /* purple */
        --callout-warning-color: #c27b3f; /* orange */
        --callout-caution-color: #c64e4e; /* red */
      }

      /* ------------------ Dark Mode ------------------ */
      body.dark {
        --primary-color: #7a92db;
        --primary-pale-color: #7a92db44;
        --primary-decoration-color: #7a92db11;
        --bg-color: #1c1c1c;
        --text-color: #e0e0e0;
        --text-pale-color: #8a8a8a;
        --text-decoration-color: #5f5f5f;
        --highlight-mark-color: #7a92db33;

        --callout-note-color: #7a92db; /* lighter blue */
        --callout-tip-color: #52a077; /* lighter green */
        --callout-important-color: #a378db; /* lighter purple */
        --callout-warning-color: #d89d68; /* softer orange */
        --callout-caution-color: #e37474; /* lighter red */
      }

      /* ------------------ Fonts & Layout ------------------ */
      body {
        /* --main-font: "Lora", "Courier", monospace; */
        --main-font:
          Work Sans, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial,
          Noto Sans, sans-serif, Apple Color Emoji, Segoe UI Emoji,
          Segoe UI Symbol, Noto Color Emoji;
        --code-font:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        --homepage-max-width: 768px;
        --main-max-width: 768px;
        --avatar-size: 60px;
        --font-size: 16px;
        --line-height: 2;
        --img-border-radius: 0px;
        --detail-border-radius: 0px;
        --dark-mode-img-brightness: 0.75;
        --dark-mode-chart-brightness: 0.75;
        --inline-code-border-radius: 2px;
        --inline-code-bg-color: var(--primary-decoration-color);
        --block-code-border-radius: 0px;
        --block-code-border-color: var(--primary-color);
        --detail-border-color: var(--primary-color);
      }

      /* ------------------ Theorem / Lemma / Definition Blocks ------------------ */
      blockquote.theorem {
        border-left: 4px solid var(--callout-note-color);
        background: #f2f7ff;
        padding: 0.75rem 1rem;
        margin: 1rem 0;
        border-radius: 0.5rem;
      }

      blockquote.theorem.lemma {
        border-color: var(--callout-tip-color);
        background: #edf9f2;
      }

      blockquote.theorem.definition {
        border-color: var(--callout-warning-color);
        background: #fff8eb;
      }

      blockquote.theorem.important {
        border-color: var(--callout-important-color);
        background: #f6f0ff;
      }

      blockquote.theorem.caution {
        border-color: var(--callout-caution-color);
        background: #ffecec;
      }

      blockquote.theorem .title {
        font-weight: 600;
        margin-bottom: 0.35rem;
        color: var(--text-color);
      }

      blockquote.theorem .content {
        margin: 0;
        color: var(--text-color);
      }

      /* Dark mode overrides for theorem blocks */
      body.dark blockquote.theorem {
        background: #22293b;
        border-left-color: var(--callout-note-color);
      }

      body.dark blockquote.theorem.lemma {
        background: #1d2d22;
        border-left-color: var(--callout-tip-color);
      }

      body.dark blockquote.theorem.definition {
        background: #2f1e0f;
        border-left-color: var(--callout-warning-color);
      }

      body.dark blockquote.theorem.important {
        background: #2a1f33;
        border-left-color: var(--callout-important-color);
      }

      body.dark blockquote.theorem.caution {
        background: #3c1f1f;
        border-left-color: var(--callout-caution-color);
      }
      body {
        font-weight: 450;
      }

      #theme-toggle {
        all: unset; /* removes all inherited and default styles */
        display: inline; /* or block, if you want */
        /* background-color: var(--bg-color); */
      }
    </style>

    <link rel="stylesheet" href="/main.css" />

    <link id="hl" rel="stylesheet" type="text/css" href="/hl-light.css" />

    <title>Secret Santa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        max-width: 600px;
        margin: 2rem auto;
        line-height: 1.6;
      }

      button {
        font-size: 1rem;
        padding: 0.5rem 0.7rem;
        margin: 0.25rem;
        cursor: pointer;
      }
      input {
        font-size: 1rem;
        padding: 0.4rem 0.6rem;
        margin-top: 0.5rem;
      }
      .names {
        margin-bottom: 1rem;
      }
      .result {
        margin-top: 1rem;
        font-weight: bold;
      }
      .hint {
        margin-top: 0.5rem;
        font-weight: normal;
      }
      .error {
        margin-top: 1rem;
        color: #b00020;
        font-weight: bold;
      }
    </style>
  </head>

  <body class="prose-page">
    <script>
      const theme = sessionStorage.getItem("theme");
      const match = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if ((theme && theme == "dark") || (!theme && match)) {
        document.body.classList.add("dark");
        const hl = document.querySelector("link#hl");
        if (hl) hl.href = "/hl-dark.css";
      }
    </script>

    <body>
      <h1>Christmas Poems</h1>

      <p>
        The head of the household, Nicky Fouhy, wants you to write a poem for
        Christmas. Click your name and enter your secret password to discover
        your randomly assigned recipient.
      </p>
      <div class="names" id="names"></div>

      <div id="auth" style="display: none">
        <p>Enter your secret code for <strong id="selectedName"></strong>:</p>
        <input id="codeInput" type="password" placeholder="Secret code" />
        <br />
        <button onclick="reveal()">Reveal my match</button>
      </div>

      <div id="output"></div>

      <script>
        const names = [
          "Ari",
          "Vicky",
          "Nicky",
          "Dan",
          "Becky",
          "Dean",
          "Tom",
          "Elly",
        ];

        // Fixed permutation (giver -> recipient)
        const permutation = {
          Ari: "Becky",
          Vicky: "Nicky",
          Nicky: "Dean",
          Dan: "Tom",
          Becky: "Vicky",
          Dean: "Dan",
          Tom: "Elly",
          Elly: "Ari",
        };

        // Secret codes (light protection only)
        const codes = {
          Ari: "apple",
          Vicky: "the ai bubble bursts",
          Nicky: "late stage capitalism",
          Dan: "dishonesty is the best policy",
          Becky: "my jesus speaketh but i not listeneth",
          Dean: "money for nothing bills for free",
          Tom: "to baz or to ball",
          Elly: "born in the usa",
        };

        // Custom prompts per giver
        const prompts = {
          Ari: "Vicky loves hiking and good coffee — something cozy or outdoorsy?",
          Vicky: "Nicky is into photography; maybe an accessory or book.",
          Nicky: "Dan enjoys cooking — spices or a fun utensil?",
          Dan: "Becky likes plants and home decor.",
          Becky: "Dean runs a lot — running socks or recovery gear?",
          Dean: "Tom enjoys board games and puzzles.",
          Tom: "Elly likes art supplies and stationery.",
          Elly: "Ari enjoys films — a cinema-themed gift?",
        };

        let currentName = null;

        const namesDiv = document.getElementById("names");
        const authDiv = document.getElementById("auth");
        const selectedNameSpan = document.getElementById("selectedName");
        const output = document.getElementById("output");
        const codeInput = document.getElementById("codeInput");

        // Render name buttons
        names.forEach((name) => {
          const btn = document.createElement("button");
          btn.textContent = name;
          btn.onclick = () => selectName(name);
          namesDiv.appendChild(btn);
        });

        function selectName(name) {
          currentName = name;
          selectedNameSpan.textContent = name;
          authDiv.style.display = "block";
          output.innerHTML = "";
          codeInput.value = "";
        }

        function reveal() {
          if (!currentName) return;

          const code = codeInput.value;

          if (codes[currentName] !== code) {
            output.innerHTML =
              '<div class="error">Incorrect secret code.</div>';
            return;
          }

          const recipient = permutation[currentName];
          // const prompt = prompts[currentName] || "";
          const prompt = "";

          output.innerHTML =
            '<div class="result">You are giving a gift to: ' +
            recipient +
            "</div>" +
            (prompt ? '<div class="hint">Hint: ' + prompt + "</div>" : "");
        }
      </script>
    </body>

    <script src="/js/main.js"></script>
  </body>
</html>
