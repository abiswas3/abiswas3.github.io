<script>
    document.addEventListener('DOMContentLoaded', function () {
      // Function to scroll to the element with an offset to avoid the header
      const scrollToElement = (element) => {
        const headerHeight = document.querySelector('header').offsetHeight + 30;
        window.scrollTo({
          top: element.offsetTop - headerHeight + 20,  // Adjust offset to avoid header overlap
          behavior: 'smooth'
        });
      };

      // Select all anchor links that reference an element (e.g., href="#ref1")
      const links = document.querySelectorAll('a[href^="#"]');

      links.forEach(link => {
        link.addEventListener('click', function (e) {
          const targetId = this.getAttribute('href').substring(1);  // Get the target ID from the href
          const targetElement = document.getElementById(targetId);  // Find the target element by its ID
          
          if (targetElement) {
            e.preventDefault();  // Prevent the default browser scrolling behavior
            history.pushState(null, null, `#`);  // Change the URL hash to reflect the anchor link
            scrollToElement(targetElement);  // Smooth scroll to the element with the offset
          }
        });
      });

      // Handle the browser's back and forward buttons
      window.addEventListener('popstate', () => {
        const targetId = location.hash.substring(1);  // Get the ID from the current hash in the URL
        if (targetId) {
          const targetElement = document.getElementById(targetId);
          if (targetElement) {
            scrollToElement(targetElement);  // Scroll to the element if it exists
          }
        }
      });
    });
</script>

<script>
let slideIndices = [0,0, 0, 0, 0, 0, ];
showDivs(slideIndices);

function plusDivs(idx, n) {
  slideIndices[idx-1] += n;
  showDivs(slideIndices);
}

function showDivs(indices) {
  let idx;
  console.log(indices);
  for(idx=0; idx < indices.length; idx++){
    
    // var dates = document.querySelectorAll('[id^="createdOnID"]');
    let tmp = '[id^="'+(idx+1)+'_slide"]'
    // console.log(tmp);    
    var x = document.querySelectorAll(tmp);
    if(x.length == 0){
      continue;
    }
    var i;    
    n = slideIndices[idx];
    if (n > x.length-1) {slideIndices[idx] = 0}

    if (n < 0) {slideIndices[idx] = x.length-1}  

    for (i = 0; i < x.length; i++) {
      x[i].style.display = "none";  
    }
    x[slideIndices[idx]].style.display = "block";
  }
}
</script>




  <!-- JavaScript to handle citation clicks and highlight -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Find all citation links
      const citations = document.querySelectorAll('.citation');

      citations.forEach(function (citation) {
        citation.addEventListener('click', function (event) {
          event.preventDefault();  // Prevent default link behavior

          const citationLink = citation.querySelector('a');  // Find the <a> inside the span

          // Get the reference ID from the citation's href (remove the '#')
          const refId = citationLink.getAttribute('href').substring(1);
            
          // Find the corresponding reference element using the ID
          const refElement = document.getElementById(refId);

          // Remove any previous highlights
          document.querySelectorAll('.highlight').forEach(function (el) {
            el.classList.remove('highlight');
          });
          document.querySelectorAll('.highlight-citation').forEach(function (el) {
            el.classList.remove('highlight-citation');
          });

          if (refElement) {
            console.log("Here");
            // Scroll to the reference (smooth scroll)
            refElement.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Add highlight to the reference
            refElement.classList.add('highlight');

            // Add highlight to the citation link
            citation.classList.add('highlight-citation');
            
          }
        });
      });
    });
  </script>
