  <script>
    document.querySelectorAll('pre').forEach(function (pre) {
      if (!pre.querySelector('code')) return;
      var button = document.createElement('button');
      button.className = 'copy-code';
      button.type = 'button';
      button.textContent = 'Copy';
      button.addEventListener('click', function () {
        var clone = pre.querySelector('code').cloneNode(true);
        clone.querySelectorAll('.giallo-ln').forEach(function (line) { line.remove(); });
        navigator.clipboard.writeText(clone.textContent).then(function () {
          button.textContent = 'Copied';
          window.setTimeout(function () { button.textContent = 'Copy'; }, 1400);
        });
      });
      pre.appendChild(button);
    });
  </script>
  <script>
    window.addEventListener('load', function () {
      function containShortcodeMath() {
        var selector =
          '.callout mjx-container[display="true"], ' +
          '.comparison-dual mjx-container[display="true"], ' +
          '.comparison-single mjx-container[display="true"]';

        function wrap(equation) {
          if (equation.parentElement.classList.contains('shortcode-math-scroll')) return;
          var boundary = document.createElement('span');
          boundary.className = 'shortcode-math-scroll';
          equation.before(boundary);
          boundary.appendChild(equation);
        }

        document.querySelectorAll(selector).forEach(wrap);

        document.querySelectorAll(
          '.callout mjx-container:not([display="true"]), ' +
          '.comparison-dual mjx-container:not([display="true"]), ' +
          '.comparison-single mjx-container:not([display="true"])'
        ).forEach(function (equation) {
          var line = equation.closest('li, p') || equation.parentElement;
          if (equation.getBoundingClientRect().width > line.clientWidth) wrap(equation);
        });
      }

      if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
        MathJax.startup.promise.then(containShortcodeMath);
      } else {
        containShortcodeMath();
      }
    });
  </script>
  <script>
    (function () {
      var prose = document.querySelector('.prose');
      if (!prose || prose.querySelector('.bibliography')) return;

      var citations = prose.querySelectorAll('a.citation[data-cite-key]');
      if (!citations.length) return;

      var bibliography = document.createElement('div');
      var heading = document.createElement('h2');
      var list = document.createElement('ol');
      var seen = new Set();

      bibliography.className = 'bibliography';
      heading.textContent = 'References';
      bibliography.append(heading, list);

      citations.forEach(function (citation) {
        var key = citation.dataset.citeKey;
        if (!key || seen.has(key)) return;
        seen.add(key);

        var item = document.createElement('li');
        var title = document.createElement('span');
        var authors = citation.dataset.citeAuthors;
        var venue = citation.dataset.citeVenue;
        var year = citation.dataset.citeYear;

        item.id = 'ref-' + key;
        if (authors) item.append(document.createTextNode(authors + '. '));
        title.className = 'bib-title';
        title.textContent = citation.dataset.citeTitle;
        item.append(title);
        if (citation.dataset.citeTitle) item.append(document.createTextNode('.'));
        if (venue) {
          var venueElement = document.createElement('em');
          venueElement.textContent = venue;
          item.append(document.createTextNode(' '), venueElement);
        }
        if (year) item.append(document.createTextNode((venue ? ', ' : ' ') + year));
        item.append(document.createTextNode('.'));
        list.appendChild(item);
      });

      prose.appendChild(bibliography);
    })();

    document.addEventListener('click', function (event) {
      var back = event.target.closest('.bib-back');
      if (back) {
        event.preventDefault();
        var source = document.getElementById(back.getAttribute('data-source'));
        if (source) source.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      var link = event.target.closest('a.citation[href^="#ref-"]');
      if (!link) return;

      event.preventDefault();
      document.querySelectorAll('.citation-highlight').forEach(function (item) {
        item.classList.remove('citation-highlight');
      });
      document.querySelectorAll('.bib-back').forEach(function (item) { item.remove(); });

      var target = document.getElementById(decodeURIComponent(link.getAttribute('href').slice(1)));
      if (!target) return;

      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.add('citation-highlight');

      if (!link.id) link.id = 'cite-source-' + target.id;
      var arrow = document.createElement('a');
      arrow.className = 'bib-back';
      arrow.setAttribute('data-source', link.id);
      arrow.setAttribute('href', '#' + link.id);
      arrow.setAttribute('aria-label', 'Back to citation');
      arrow.textContent = ' ↩';
      target.appendChild(arrow);
    });
  </script>
