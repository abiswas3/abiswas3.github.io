<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" width="340" height="250" role="img" aria-label="A 4-cycle on vertices a, b, c, d. The edges ab and cd are in the set S0, and the edges bc and da are in the set S1.">
  <style>
    text { font-family: "Latin Modern Roman", "STIX Two Text", "Times New Roman", serif; font-style: italic; fill: #111; }
    .vertex { font-size: 18px; }
    .name { font-size: 19px; }
    .sub { font-size: 13px; font-style: normal; }
  </style>

  <line x1="90" y1="55" x2="250" y2="55" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="195" x2="250" y2="195" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="55" x2="250" y2="195" stroke="#2563a8" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="55" x2="90" y2="195" stroke="#2563a8" stroke-width="3" stroke-linecap="round"/>

  <circle cx="90" cy="55" r="6" fill="#111"/>
  <circle cx="250" cy="55" r="6" fill="#111"/>
  <circle cx="250" cy="195" r="6" fill="#111"/>
  <circle cx="90" cy="195" r="6" fill="#111"/>

  <text class="vertex" x="72" y="48" text-anchor="middle">a</text>
  <text class="vertex" x="268" y="48" text-anchor="middle">b</text>
  <text class="vertex" x="268" y="212" text-anchor="middle">c</text>
  <text class="vertex" x="72" y="212" text-anchor="middle">d</text>

  <text class="name" x="170" y="42" text-anchor="middle" style="fill:#c0392b">S<tspan class="sub" dy="5">0</tspan></text>
  <text class="name" x="170" y="223" text-anchor="middle" style="fill:#c0392b">S<tspan class="sub" dy="5">0</tspan></text>
  <text class="name" x="52" y="130" text-anchor="middle" style="fill:#2563a8">S<tspan class="sub" dy="5">1</tspan></text>
  <text class="name" x="288" y="130" text-anchor="middle" style="fill:#2563a8">S<tspan class="sub" dy="5">1</tspan></text>
</svg>
