<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" width="520" height="290" role="img" aria-label="A hypergraph with hyperedges F on vertices u, v, w, F1 on vertices u, a, b, F2 on vertices w, c, and F3 on vertices b, c. F1 and F2 intersect F, and F3 does not.">
  <style>
    text { font-family: "Latin Modern Roman", "STIX Two Text", "Times New Roman", serif; font-style: italic; fill: #111; }
    .vertex { font-size: 18px; }
    .name { font-size: 19px; }
    .sub { font-size: 13px; font-style: normal; }
  </style>

  <line x1="170" y1="44" x2="420" y2="44" stroke="#8a8a8a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="380" y1="170" x2="420" y2="44" stroke="#2563a8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="200,170 80,120 170,44" fill="#2563a8" fill-opacity="0.25" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="200,170 380,170 290,250" fill="#c0392b" fill-opacity="0.25" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/>

  <circle cx="170" cy="44" r="6" fill="#111"/>
  <circle cx="420" cy="44" r="6" fill="#111"/>
  <circle cx="80" cy="120" r="6" fill="#111"/>
  <circle cx="200" cy="170" r="6" fill="#111"/>
  <circle cx="380" cy="170" r="6" fill="#111"/>
  <circle cx="290" cy="250" r="6" fill="#111"/>

  <text class="vertex" x="160" y="30" text-anchor="middle">b</text>
  <text class="vertex" x="430" y="30" text-anchor="middle">c</text>
  <text class="vertex" x="60" y="118" text-anchor="middle">a</text>
  <text class="vertex" x="186" y="192" text-anchor="middle">u</text>
  <text class="vertex" x="398" y="188" text-anchor="middle">w</text>
  <text class="vertex" x="290" y="278" text-anchor="middle">v</text>

  <text class="name" x="152" y="118" text-anchor="middle" style="fill:#2563a8">F<tspan class="sub" dy="5">1</tspan></text>
  <text class="name" x="418" y="118" text-anchor="middle" style="fill:#2563a8">F<tspan class="sub" dy="5">2</tspan></text>
  <text class="name" x="295" y="32" text-anchor="middle" style="fill:#6f6f6f">F<tspan class="sub" dy="5">3</tspan></text>
  <text class="name" x="290" y="203" text-anchor="middle" style="fill:#c0392b">F</text>
</svg>
