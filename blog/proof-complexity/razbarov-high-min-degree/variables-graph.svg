<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-label="A triangle on vertices a, b, c. Each of its three edges ab, bc and ca has its own variable.">
  <style>
    text { font-family: "Latin Modern Roman", "STIX Two Text", "Times New Roman", serif; font-style: italic; fill: #111; }
    .vertex { font-size: 18px; }
    .var { font-size: 19px; }
    .sub { font-size: 13px; }
  </style>

  <line x1="180" y1="40" x2="70" y2="210" stroke="#2563a8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="180" y1="40" x2="290" y2="210" stroke="#2563a8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="210" x2="290" y2="210" stroke="#2563a8" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="180" cy="40" r="6" fill="#111"/>
  <circle cx="70" cy="210" r="6" fill="#111"/>
  <circle cx="290" cy="210" r="6" fill="#111"/>

  <text class="vertex" x="180" y="24" text-anchor="middle">a</text>
  <text class="vertex" x="50" y="216" text-anchor="middle">b</text>
  <text class="vertex" x="310" y="216" text-anchor="middle">c</text>

  <text class="var" x="100" y="120" text-anchor="middle">x<tspan class="sub" dy="5">ab</tspan></text>
  <text class="var" x="262" y="120" text-anchor="middle">x<tspan class="sub" dy="5">ca</tspan></text>
  <text class="var" x="180" y="240" text-anchor="middle">x<tspan class="sub" dy="5">bc</tspan></text>
</svg>
