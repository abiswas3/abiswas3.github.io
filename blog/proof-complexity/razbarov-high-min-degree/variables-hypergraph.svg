<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="A hypergraph with three hyperedges: F1 on vertices a, b, u is a shaded triangle, F2 on vertices u, v, w is a shaded triangle, and F3 on vertices w, c is a line. Each hyperedge has its own variable.">
  <style>
    text { font-family: "Latin Modern Roman", "STIX Two Text", "Times New Roman", serif; font-style: italic; fill: #111; }
    .vertex { font-size: 18px; }
    .var { font-size: 19px; }
    .sub { font-size: 13px; }
    .subsub { font-size: 10px; font-style: normal; }
  </style>

  <polygon points="75,125 165,45 195,170" fill="#2563a8" fill-opacity="0.25" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="195,170 375,170 285,250" fill="#2563a8" fill-opacity="0.25" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="375" y1="170" x2="435" y2="60" stroke="#2563a8" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="75" cy="125" r="6" fill="#111"/>
  <circle cx="165" cy="45" r="6" fill="#111"/>
  <circle cx="195" cy="170" r="6" fill="#111"/>
  <circle cx="375" cy="170" r="6" fill="#111"/>
  <circle cx="285" cy="250" r="6" fill="#111"/>
  <circle cx="435" cy="60" r="6" fill="#111"/>

  <text class="vertex" x="56" y="124" text-anchor="middle">a</text>
  <text class="vertex" x="165" y="30" text-anchor="middle">b</text>
  <text class="vertex" x="182" y="192" text-anchor="middle">u</text>
  <text class="vertex" x="393" y="188" text-anchor="middle">w</text>
  <text class="vertex" x="285" y="278" text-anchor="middle">v</text>
  <text class="vertex" x="452" y="56" text-anchor="middle">c</text>

  <text class="var" x="146" y="120" text-anchor="middle">x<tspan class="sub" dy="5">F</tspan><tspan class="subsub" dy="3">1</tspan></text>
  <text class="var" x="285" y="203" text-anchor="middle">x<tspan class="sub" dy="5">F</tspan><tspan class="subsub" dy="3">2</tspan></text>
  <text class="var" x="435" y="130" text-anchor="middle">x<tspan class="sub" dy="5">F</tspan><tspan class="subsub" dy="3">3</tspan></text>
</svg>
