<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250" role="img" aria-label="On the left, the lines D1, D2, D3 up to DL of the refutation pi. On the right, the lines theta of D1, theta of D2, theta of D3, up to theta of DL of the sequence pi plus. An arrow labelled theta goes from each line on the left to the matching line on the right.">
  <style>
    text { font-family: "Latin Modern Roman", "STIX Two Text", "Times New Roman", serif; fill: #111; }
    .line { font-size: 19px; font-style: italic; }
    .sub { font-size: 13px; font-style: italic; }
    .up { font-size: 13px; font-style: normal; }
    .title { font-size: 21px; font-style: italic; }
    .op { font-size: 14px; font-style: italic; }
    .dots { font-size: 19px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a8"/>
    </marker>
  </defs>

  <text class="title" x="55" y="28" text-anchor="middle">π</text>
  <text class="title" x="245" y="28" text-anchor="middle">π<tspan class="up" dy="-8">+</tspan></text>

  <text class="line" x="55" y="70" text-anchor="middle">D<tspan class="sub" dy="5">1</tspan></text>
  <text class="line" x="55" y="110" text-anchor="middle">D<tspan class="sub" dy="5">2</tspan></text>
  <text class="line" x="55" y="150" text-anchor="middle">D<tspan class="sub" dy="5">3</tspan></text>
  <text class="dots" x="55" y="188" text-anchor="middle">⋮</text>
  <text class="line" x="55" y="230" text-anchor="middle">D<tspan class="sub" dy="5">L</tspan></text>

  <text class="line" x="245" y="70" text-anchor="middle">θ(D<tspan class="sub" dy="5">1</tspan><tspan dy="-5">)</tspan></text>
  <text class="line" x="245" y="110" text-anchor="middle">θ(D<tspan class="sub" dy="5">2</tspan><tspan dy="-5">)</tspan></text>
  <text class="line" x="245" y="150" text-anchor="middle">θ(D<tspan class="sub" dy="5">3</tspan><tspan dy="-5">)</tspan></text>
  <text class="dots" x="245" y="188" text-anchor="middle">⋮</text>
  <text class="line" x="245" y="230" text-anchor="middle">θ(D<tspan class="sub" dy="5">L</tspan><tspan dy="-5">)</tspan></text>

  <g stroke="#2563a8" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="85" y1="64" x2="205" y2="64"/>
    <line x1="85" y1="104" x2="205" y2="104"/>
    <line x1="85" y1="144" x2="205" y2="144"/>
    <line x1="85" y1="224" x2="205" y2="224"/>
  </g>
  <text class="op" x="145" y="56" text-anchor="middle" style="fill:#2563a8">θ</text>
  <text class="op" x="145" y="96" text-anchor="middle" style="fill:#2563a8">θ</text>
  <text class="op" x="145" y="136" text-anchor="middle" style="fill:#2563a8">θ</text>
  <text class="op" x="145" y="216" text-anchor="middle" style="fill:#2563a8">θ</text>
</svg>
