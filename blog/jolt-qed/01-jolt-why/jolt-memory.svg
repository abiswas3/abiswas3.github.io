<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 988" width="1000" height="988">

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
    .t { font-size: 15px; font-weight: 600; }
    .h { font-size: 13px; font-weight: 600; }
    .l { font-size: 13px; }
    .s { font-size: 12px; fill: #374151; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .r { text-anchor: end; }
    .c { text-anchor: middle; }
    .io { fill: #dbeafe; stroke: #2563eb; }
    .ram { fill: #dcfce7; stroke: #16a34a; }
    .pad { fill: url(#hatch); stroke: #6b7280; }
    .bad { fill: #fee2e2; stroke: #dc2626; }
    .warn { fill: #b45309; font-weight: 600; font-size: 12px; }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f3f4f6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9ca3af" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text class="t" x="20" y="30">Jolt memory: 64-bit address → 64-bit value</text>
  <text class="s" x="20" y="50">Invented toy configuration, drawn to scale. Each address holds 8 bits, so one row = 8 addresses = 64 bits. Row a starts at address lowest + 8a.</text>
  <rect class="io" x="330" y="100" width="230" height="48"/>
  <text class="l c" x="445.0" y="128.0">trusted advice</text>
  <rect class="io" x="330" y="148" width="230" height="24"/>
  <text class="l c" x="445.0" y="164.0">untrusted advice</text>
  <rect class="io" x="330" y="172" width="230" height="24"/>
  <text class="l c" x="445.0" y="188.0">inputs</text>
  <rect class="io" x="330" y="196" width="230" height="24"/>
  <text class="l c" x="445.0" y="212.0">outputs</text>
  <rect class="io" x="330" y="220" width="230" height="12"/>
  <rect class="io" x="330" y="232" width="230" height="12"/>
  <rect class="pad" x="330" y="244" width="230" height="48"/>
  <text class="l c" x="445.0" y="272.0">IO padding</text>
  <rect class="ram" x="330" y="292" width="230" height="96"/>
  <text class="l c" x="445.0" y="344.0">program image</text>
  <rect class="ram" x="330" y="388" width="230" height="192"/>
  <text class="l c" x="445.0" y="488.0">stack canary (128 addresses)</text>
  <rect class="ram" x="330" y="580" width="230" height="96"/>
  <text class="l c" x="445.0" y="632.0">stack (grows down)</text>
  <rect class="ram" x="330" y="676" width="230" height="96"/>
  <text class="l c" x="445.0" y="728.0">heap (grows up)</text>
  <rect class="pad" x="330" y="772" width="230" height="96"/>
  <text class="l c" x="445.0" y="824.0">table padding</text>
  <rect x="330" y="100" width="230" height="768" fill="none" stroke="#111827" stroke-width="1.5"/>
  <line x1="320" y1="292" x2="570" y2="292" stroke="#111827" stroke-width="3"/>
  <line x1="320" y1="772" x2="570" y2="772" stroke="#111827" stroke-width="3"/>
  <text class="h r" x="125" y="86">name</text>
  <text class="h r" x="240" y="86">byte address</text>
  <text class="h r" x="318" y="86">row</text>
  <text class="m r" x="125" y="104">lowest</text>
  <text class="m r" x="240" y="104">0x7FFF_FF80</text>
  <text class="m r" x="318" y="104">0</text>
  <line x1="322" y1="100" x2="330" y2="100" stroke="#6b7280"/>
  <text class="m r" x="125" y="152">untrusted_start</text>
  <text class="m r" x="240" y="152">0x7FFF_FFA0</text>
  <text class="m r" x="318" y="152">4</text>
  <line x1="322" y1="148" x2="330" y2="148" stroke="#6b7280"/>
  <text class="m r" x="125" y="176">input_start</text>
  <text class="m r" x="240" y="176">0x7FFF_FFB0</text>
  <text class="m r" x="318" y="176">6</text>
  <line x1="322" y1="172" x2="330" y2="172" stroke="#6b7280"/>
  <text class="m r" x="125" y="200">output_start</text>
  <text class="m r" x="240" y="200">0x7FFF_FFC0</text>
  <text class="m r" x="318" y="200">8</text>
  <line x1="322" y1="196" x2="330" y2="196" stroke="#6b7280"/>
  <text class="m r" x="125" y="224">panic</text>
  <text class="m r" x="240" y="224">0x7FFF_FFD0</text>
  <text class="m r" x="318" y="224">10</text>
  <line x1="322" y1="220" x2="330" y2="220" stroke="#6b7280"/>
  <text class="m r" x="125" y="236">termination</text>
  <text class="m r" x="240" y="236">0x7FFF_FFD8</text>
  <text class="m r" x="318" y="236">11</text>
  <line x1="322" y1="232" x2="330" y2="232" stroke="#6b7280"/>
  <text class="m r" x="125" y="248">io_end</text>
  <text class="m r" x="240" y="248">0x7FFF_FFE0</text>
  <text class="m r" x="318" y="248">12</text>
  <line x1="322" y1="244" x2="330" y2="244" stroke="#6b7280"/>
  <text class="m r" x="125" y="296">RAM_START</text>
  <text class="m r" x="240" y="296">0x8000_0000</text>
  <text class="m r" x="318" y="296">16</text>
  <line x1="322" y1="292" x2="330" y2="292" stroke="#6b7280"/>
  <text class="m r" x="125" y="392">stack_end</text>
  <text class="m r" x="240" y="392">0x8000_0040</text>
  <text class="m r" x="318" y="392">24</text>
  <line x1="322" y1="388" x2="330" y2="388" stroke="#6b7280"/>
  <text class="m r" x="125" y="584">stack_end + 128</text>
  <text class="m r" x="240" y="584">0x8000_00C0</text>
  <text class="m r" x="318" y="584">40</text>
  <line x1="322" y1="580" x2="330" y2="580" stroke="#6b7280"/>
  <text class="m r" x="125" y="680">stack_start</text>
  <text class="m r" x="240" y="680">0x8000_0100</text>
  <text class="m r" x="318" y="680">48</text>
  <line x1="322" y1="676" x2="330" y2="676" stroke="#6b7280"/>
  <text class="m r" x="125" y="776">heap_end</text>
  <text class="m r" x="240" y="776">0x8000_0140</text>
  <text class="m r" x="318" y="776">56</text>
  <line x1="322" y1="772" x2="330" y2="772" stroke="#6b7280"/>
  <text class="m r" x="125" y="872">lowest + 8·ram_K</text>
  <text class="m r" x="240" y="872">0x8000_0180</text>
  <text class="m r" x="318" y="872">64</text>
  <line x1="322" y1="868" x2="330" y2="868" stroke="#6b7280"/>
  <line x1="560" y1="226.0" x2="580" y2="220.0" stroke="#374151"/>
  <text class="s" x="584" y="223.0">panic (64 bits)</text>
  <line x1="560" y1="238.0" x2="580" y2="246.0" stroke="#374151"/>
  <text class="s" x="584" y="250.0">termination (64 bits)</text>
  <text class="s" x="584" y="488">writes forbidden (Rust panics)</text>
  <path d="M 790 102 L 798 102 L 798 242 L 790 242" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text class="l" x="806" y="160.0">JoltDevice</text>
  <text class="s" x="806" y="176.0">advice, inputs, outputs,</text>
  <text class="s" x="806" y="192.0">panic, termination</text>
  <path d="M 790 246 L 798 246 L 798 290 L 790 290" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text class="l" x="806" y="272.0">Other: padding</text>
  <path d="M 790 294 L 798 294 L 798 770 L 790 770" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text class="l" x="806" y="520.0">RAM</text>
  <text class="s" x="806" y="536.0">Rust Memory, from RAM_START</text>
  <text class="s" x="806" y="552.0">to heap_end</text>
  <path d="M 790 774 L 798 774 L 798 866 L 790 866" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text class="l" x="806" y="824.0">Other: padding</text>
  <rect class="io" x="20" y="908" width="18" height="14"/><text class="s" x="46" y="920">JoltDevice (advice, inputs, outputs, panic, termination)</text>
  <rect class="ram" x="20" y="932" width="18" height="14"/><text class="s" x="46" y="944">RAM (program image, stack canary, stack, heap)</text>
  <rect class="pad" x="20" y="956" width="18" height="14"/><text class="s" x="46" y="968">Other: in the table, but neither JoltDevice nor RAM (Rust panics on access)</text>
  <text class="s" x="520" y="920">Invented sizes, in addresses: trusted advice 32, untrusted advice 16,</text>
  <text class="s" x="520" y="936">inputs 16, outputs 16, program 64, stack 64, heap 64.</text>
  <text class="s" x="520" y="956">Constants: RAM_START = 0x8000_0000, stack canary = 128 addresses.</text>
</svg>
