<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 864" width="860" height="864" role="img" aria-labelledby="title description">
  <title id="title">Jolt memory regions</title>
  <desc id="description">In increasing address order: trusted advice, untrusted advice, inputs, outputs, an eight-byte panic region, an eight-byte termination region, I/O padding, the program image, a 128-byte stack canary, the stack, and the heap. The advice regions swap when untrusted advice is larger. RAM begins at address 0x80000000. Region heights are not to scale.</desc>
  <!-- Layout: JoltBytecode/JoltISA/JoltDevice.lean, MemoryLayout.new. -->
  <defs>
    <pattern id="padding" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f3f4f6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
    .heading { font-size: 26px; font-weight: 650; }
    .label { font-size: 20px; font-weight: 550; text-anchor: middle; }
    .group { font-size: 20px; font-weight: 600; text-anchor: middle; }
    .small { font-size: 16px; fill: #475569; }
    .address { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #475569; }
    .boundary { stroke: #94a3b8; stroke-width: 1; }
    .device { fill: #dbeafe; stroke: #93c5fd; }
    .ram { fill: #dcfce7; stroke: #86efac; }
  </style>
  <rect width="860" height="864" fill="#ffffff"/>
  <text class="heading" x="28" y="43">Jolt memory regions</text>
  <text class="small" x="28" y="71">64-bit byte addresses</text>

  <line x1="60" y1="108" x2="60" y2="768" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="small" x="36" y="438" text-anchor="middle" transform="rotate(-90 36 438)">Increasing addresses</text>
  <path d="M 164 108 H 148 V 448 H 164" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="group" x="124" y="278" transform="rotate(-90 124 278)">Jolt device</text>
  <path d="M 164 492 H 148 V 768 H 164" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text class="group" x="124" y="630" transform="rotate(-90 124 630)">Ordinary RAM</text>

  <rect class="device" x="180" y="108" width="340" height="62"/>
  <text class="label" x="350" y="146">Trusted advice</text>
  <rect class="device" x="180" y="170" width="340" height="62"/>
  <text class="label" x="350" y="208">Untrusted advice</text>
  <rect class="device" x="180" y="232" width="340" height="56"/>
  <text class="label" x="350" y="267">Inputs</text>
  <rect class="device" x="180" y="288" width="340" height="56"/>
  <text class="label" x="350" y="323">Outputs</text>
  <rect x="180" y="344" width="340" height="52" fill="#ffe4e6" stroke="#fda4af"/>
  <text class="label" x="350" y="377">Panic · 8 bytes</text>
  <rect x="180" y="396" width="340" height="52" fill="#ede9fe" stroke="#c4b5fd"/>
  <text class="label" x="350" y="429">Termination · 8 bytes</text>
  <rect x="180" y="448" width="340" height="44" fill="url(#padding)" stroke="#9ca3af"/>
  <text class="label" x="350" y="477">I/O padding</text>

  <rect class="ram" x="180" y="492" width="340" height="88"/>
  <text class="label" x="350" y="531">Program image</text>
  <text class="small" x="350" y="556" text-anchor="middle">Code and data</text>
  <rect x="180" y="580" width="340" height="44" fill="#fef3c7" stroke="#fbbf24"/>
  <text class="label" x="350" y="609">Stack canary · 128 bytes</text>
  <rect class="ram" x="180" y="624" width="340" height="72"/>
  <text class="label" x="350" y="653">Stack</text>
  <text class="small" x="350" y="678" text-anchor="middle">Grows toward lower addresses</text>
  <rect class="ram" x="180" y="696" width="340" height="72"/>
  <text class="label" x="350" y="725">Heap</text>
  <text class="small" x="350" y="750" text-anchor="middle">Grows toward higher addresses</text>

  <rect x="180" y="108" width="340" height="660" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="174" y1="492" x2="544" y2="492" stroke="#111827" stroke-width="2.5"/>
  <g class="boundary">
    <line x1="520" y1="108" x2="544" y2="108"/>
    <line x1="520" y1="170" x2="544" y2="170"/>
    <line x1="520" y1="232" x2="544" y2="232"/>
    <line x1="520" y1="288" x2="544" y2="288"/>
    <line x1="520" y1="344" x2="544" y2="344"/>
    <line x1="520" y1="396" x2="544" y2="396"/>
    <line x1="520" y1="448" x2="544" y2="448"/>
    <line x1="520" y1="580" x2="544" y2="580"/>
    <line x1="520" y1="624" x2="544" y2="624"/>
    <line x1="520" y1="696" x2="544" y2="696"/>
    <line x1="520" y1="768" x2="544" y2="768"/>
  </g>
  <text class="address" x="558" y="113">trusted_advice_start</text>
  <text class="address" x="558" y="175">untrusted_advice_start</text>
  <text class="address" x="558" y="237">input_start</text>
  <text class="address" x="558" y="293">output_start</text>
  <text class="address" x="558" y="349">panic</text>
  <text class="address" x="558" y="401">termination</text>
  <text class="address" x="558" y="453">io_end</text>
  <text class="address" x="558" y="497">RAM_START_ADDRESS</text>
  <text class="address" x="558" y="520">0x8000_0000</text>
  <text class="address" x="558" y="585">stack_end</text>
  <text class="address" x="558" y="629">stack_end + 128</text>
  <text class="address" x="558" y="701">stack_start</text>
  <text class="address" x="558" y="773">heap_end</text>

  <text class="small" x="28" y="813">Advice regions swap when untrusted advice is larger.</text>
  <text class="small" x="28" y="839">Schematic; region heights are not proportional to their sizes.</text>
</svg>
