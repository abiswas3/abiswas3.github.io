<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="25" font-size="18" font-weight="bold" text-anchor="middle" fill="#3DBBFF">
    Embedding Theorem (Black Box Model)
  </text>
  
  <!-- Input box -->
  <g id="input">
    <rect x="50" y="50" width="200" height="100" fill="#00000005" stroke="#3DBBFF" stroke-width="2" rx="5"/>
    <text x="150" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="#3DBBFF">
      Input
    </text>
    <text x="150" y="95" font-size="12" text-anchor="middle" fill="#999">
      D ∈ ℕ (max degree)
    </text>
    <text x="150" y="115" font-size="12" text-anchor="middle" fill="#999">
      G = (V, E)
    </text>
    <text x="150" y="132" font-size="11" text-anchor="middle" fill="#666">
      n vertices, m edges
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="250" y1="100" x2="310" y2="100" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="90" font-size="11" text-anchor="middle" fill="#666">D</text>
  
  <!-- Black box -->
  <g id="blackbox">
    <rect x="310" y="60" width="180" height="80" fill="#00000010" stroke="#888" stroke-width="3" rx="8"/>
    <text x="400" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#888">
      Embedding Theorem
    </text>
    <text x="400" y="110" font-size="11" text-anchor="middle" fill="#666">
      (magic black box)
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="490" y1="100" x2="550" y2="100" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="90" font-size="11" text-anchor="middle" fill="#FF6B9D">α, ξ, C</text>
  
  <!-- Output box -->
  <g id="output">
    <rect x="550" y="50" width="200" height="100" fill="#00000005" stroke="#FF6B9D" stroke-width="2" rx="5"/>
    <text x="650" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="#FF6B9D">
      Constants
    </text>
    <text x="650" y="95" font-size="12" text-anchor="middle" fill="#999">
      α (size bound)
    </text>
    <text x="650" y="113" font-size="12" text-anchor="middle" fill="#999">
      ξ (pseudorandom param)
    </text>
    <text x="650" y="131" font-size="12" text-anchor="middle" fill="#999">
      C (density threshold)
    </text>
  </g>
  
  <!-- Conditions box -->
  <g id="conditions">
    <rect x="50" y="180" width="700" height="120" fill="#7CFC0005" stroke="#7CFC00" stroke-width="2" rx="8"/>
    <text x="400" y="205" font-size="15" font-weight="bold" text-anchor="middle" fill="#7CFC00">
      Check Conditions
    </text>
    
    <!-- Condition 1 -->
    <g transform="translate(80, 220)">
      <rect x="0" y="0" width="300" height="55" fill="#00000005" stroke="#888" stroke-width="1" rx="4"/>
      <text x="10" y="20" font-size="12" font-weight="bold" fill="#3DBBFF">
        1. Density:
      </text>
      <text x="20" y="40" font-size="11" fill="#999" font-family="monospace">
        m ≥ Cn
      </text>
    </g>
    
    <!-- Condition 2 -->
    <g transform="translate(400, 220)">
      <rect x="0" y="0" width="320" height="55" fill="#00000005" stroke="#888" stroke-width="1" rx="4"/>
      <text x="10" y="20" font-size="12" font-weight="bold" fill="#3DBBFF">
        2. Pseudorandomness:
      </text>
      <text x="10" y="38" font-size="10" fill="#999" font-family="monospace">
        ∀ disjoint S,T: |S|,|T| ≥ ξn
      </text>
      <text>

      </text>
      <text x="10" y="50" font-size="10" fill="#999" font-family="monospace">
        |e(S,T) - |S||T|p| ≤ ξ|S||T|p
      </text>
    </g>
  </g>
  
  <!-- Big arrow down -->
  <!-- <line x1="400" y1="310" x2="400" y2="340" stroke="#00D9FF" stroke-width="4" marker-end="url(#arrow-big)"/> -->
  <text x="340" y="330" font-size="13" font-weight="bold" fill="#00D9FF">
    Both hold?
  </text>
  
  <!-- Result box -->
  <g id="result">
    <rect x="50" y="350" width="700" height="90" fill="#00D9FF10" stroke="#00D9FF" stroke-width="3" rx="8"/>
    <text x="400" y="375" font-size="15" font-weight="bold" text-anchor="middle" fill="#00D9FF">
      Then: Can embed ANY graph H
    </text>
    
    <text x="80" y="400" font-size="12" fill="#999">
      • Max degree ≤ D
    </text>
    <text x="80" y="418" font-size="12" fill="#999">
      • H^σ has ≤ αn vertices  (i.e., H has ≈ αn/log n vertices)
    </text>
    
    <text x="500" y="409" font-size="12" fill="#666" font-style="italic">
      as topological minor with σ(e) ≥ log n
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arrow-big" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#00D9FF"/>
    </marker>
  </defs>
</svg>
