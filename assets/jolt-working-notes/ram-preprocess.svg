<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Title -->
  <text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial">
    RAMPreprocessing: Bytes → Words
  </text>
  
  <!-- Sparse Byte Storage -->
  <text x="150" y="70" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">
    Input: Vec&lt;(address, byte)&gt;
  </text>
  
  <!-- Byte pairs -->
  <g id="bytes">
    <rect x="20" y="90" width="130" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="85" y="111" font-size="12" text-anchor="middle" font-family="monospace">(0x80000000, 0x17)</text>
    
    <rect x="20" y="125" width="130" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="85" y="146" font-size="12" text-anchor="middle" font-family="monospace">(0x80000001, 0x11)</text>
    
    <rect x="20" y="160" width="130" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="85" y="181" font-size="12" text-anchor="middle" font-family="monospace">(0x80000002, 0x00)</text>
    
    <rect x="20" y="195" width="130" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="85" y="216" font-size="12" text-anchor="middle" font-family="monospace">(0x80000003, 0x01)</text>
    
    <rect x="20" y="230" width="130" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="85" y="251" font-size="12" text-anchor="middle" font-family="monospace">(0x80000004, 0x13)</text>
    
    <rect x="20" y="265" width="130" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="85" y="286" font-size="12" text-anchor="middle" font-family="monospace">(0x80000005, 0x01)</text>
    
    <rect x="20" y="300" width="130" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="85" y="321" font-size="12" text-anchor="middle" font-family="monospace">(0x80000006, 0x01)</text>
    
    <rect x="20" y="335" width="130" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="85" y="356" font-size="12" text-anchor="middle" font-family="monospace">(0x80000007, 0x12)</text>
    
    <rect x="20" y="375" width="130" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="85" y="396" font-size="12" text-anchor="middle" font-family="monospace">(0x80000008, 0x97)</text>
    
    <text x="85" y="425" font-size="14" text-anchor="middle" font-family="Arial">...</text>
  </g>
  
  <!-- Arrow and process -->
  <g id="process">
    <path d="M 170 240 L 280 240" stroke="#4caf50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <text x="225" y="220" font-size="14" font-weight="bold" text-anchor="middle" fill="#4caf50" font-family="Arial">
      chunk_by
    </text>
    <text x="225" y="237" font-size="12" text-anchor="middle" fill="#4caf50" font-family="Arial">
      address / 8
    </text>
    <text x="225" y="270" font-size="11" text-anchor="middle" fill="#666" font-family="Arial">
      Group into 8-byte words
    </text>
  </g>
  
  <!-- Chunked representation -->
  <g id="chunks">
    <text x="380" y="110" font-size="13" font-weight="bold" text-anchor="start" font-family="Arial">
      Chunk 0 (addr / 8 = 0x10000000):
    </text>
    
    <!-- 8 bytes in a row -->
    <rect x="300" y="120" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="317" y="141" font-size="10" text-anchor="middle" font-family="monospace">0x17</text>
    
    <rect x="335" y="120" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="352" y="141" font-size="10" text-anchor="middle" font-family="monospace">0x11</text>
    
    <rect x="370" y="120" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="387" y="141" font-size="10" text-anchor="middle" font-family="monospace">0x00</text>
    
    <rect x="405" y="120" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="422" y="141" font-size="10" text-anchor="middle" font-family="monospace">0x01</text>
    
    <rect x="440" y="120" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="457" y="141" font-size="10" text-anchor="middle" font-family="monospace">0x13</text>
    
    <rect x="475" y="120" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="492" y="141" font-size="10" text-anchor="middle" font-family="monospace">0x01</text>
    
    <rect x="510" y="120" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="527" y="141" font-size="10" text-anchor="middle" font-family="monospace">0x01</text>
    
    <rect x="545" y="120" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="562" y="141" font-size="10" text-anchor="middle" font-family="monospace">0x12</text>
    
    <!-- Brace showing 8 bytes -->
    <path d="M 300 155 L 300 160 L 580 160 L 580 155" stroke="#666" stroke-width="1" fill="none"/>
    <text x="440" y="175" font-size="11" text-anchor="middle" fill="#666" font-family="Arial">8 bytes</text>
    
    <!-- Second chunk -->
    <text x="380" y="210" font-size="13" font-weight="bold" text-anchor="start" font-family="Arial">
      Chunk 1 (addr / 8 = 0x10000001):
    </text>
    
    <rect x="300" y="220" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="317" y="241" font-size="10" text-anchor="middle" font-family="monospace">0x97</text>
    
    <rect x="335" y="220" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="352" y="241" font-size="10" text-anchor="middle" font-family="monospace">...</text>
    
    <rect x="370" y="220" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="387" y="241" font-size="10" text-anchor="middle" font-family="monospace">...</text>
    
    <rect x="405" y="220" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="422" y="241" font-size="10" text-anchor="middle" font-family="monospace">...</text>
    
    <rect x="440" y="220" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="457" y="241" font-size="10" text-anchor="middle" font-family="monospace">...</text>
    
    <rect x="475" y="220" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="492" y="241" font-size="10" text-anchor="middle" font-family="monospace">...</text>
    
    <rect x="510" y="220" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="527" y="241" font-size="10" text-anchor="middle" font-family="monospace">...</text>
    
    <rect x="545" y="220" width="35" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="562" y="241" font-size="10" text-anchor="middle" font-family="monospace">...</text>
    
    <text x="440" y="275" font-size="13" text-anchor="middle" font-family="Arial">...</text>
  </g>
  
  <!-- Final arrow -->
  <g id="final-arrow">
    <path d="M 440 290 L 440 335" stroke="#9c27b0" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
    <text x="500" y="315" font-size="14" font-weight="bold" fill="#9c27b0" font-family="Arial">
      Pack into u64
    </text>
  </g>
  
  <!-- Dense Word Array -->
  <g id="words">
    <text x="440" y="370" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">
      Output: bytecode_words: Vec&lt;u64&gt;
    </text>
    
    <rect x="270" y="380" width="340" height="40" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="440" y="406" font-size="13" text-anchor="middle" font-family="monospace">
      [0] = 0x1201010113000117
    </text>
    
    <rect x="270" y="425" width="340" height="40" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="440" y="451" font-size="13" text-anchor="middle" font-family="monospace">
      [1] = 0x????????????????97
    </text>
    
    <text x="440" y="480" font-size="14" text-anchor="middle" font-family="Arial">...</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4caf50"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="5" refY="0" orient="down">
      <polygon points="0 0, 10 0, 5 10" fill="#9c27b0"/>
    </marker>
  </defs>
</svg>
