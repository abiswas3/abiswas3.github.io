<svg width="900" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="300" fill="#1e1e2e"/>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#cdd6f4">
    Round Division: Streaming and Linear Phases (m = 16)
  </text>
  
  <!-- Main container for rounds -->
  <g transform="translate(50, 80)">
    
    <!-- Streaming Phase Background -->
    <rect x="0" y="0" width="450" height="80" fill="#313244" stroke="#585b70" stroke-width="2" rx="5"/>
    
    <!-- Linear Phase Background -->
    <rect x="450" y="0" width="350" height="80" fill="#45475a" stroke="#585b70" stroke-width="2" rx="5"/>
    
    <!-- Streaming Windows -->
    <!-- Window 1: rounds 0-2 -->
    <rect x="10" y="10" width="140" height="60" fill="#89b4fa" fill-opacity="0.3" stroke="#89b4fa" stroke-width="2" rx="3"/>
    
    <!-- Window 2: rounds 3-5 -->
    <rect x="160" y="10" width="140" height="60" fill="#94e2d5" fill-opacity="0.3" stroke="#94e2d5" stroke-width="2" rx="3"/>
    
    <!-- Window 3: rounds 6-8 -->
    <rect x="310" y="10" width="130" height="60" fill="#a6e3a1" fill-opacity="0.3" stroke="#a6e3a1" stroke-width="2" rx="3"/>
    
    <!-- Individual round boxes -->
    <!-- Streaming rounds 0-8 -->
    <g fill="#f9e2af">
      <rect x="20" y="25" width="35" height="30" rx="2"/>
      <rect x="65" y="25" width="35" height="30" rx="2"/>
      <rect x="110" y="25" width="35" height="30" rx="2"/>
      
      <rect x="170" y="25" width="35" height="30" rx="2"/>
      <rect x="215" y="25" width="35" height="30" rx="2"/>
      <rect x="260" y="25" width="35" height="30" rx="2"/>
      
      <rect x="320" y="25" width="35" height="30" rx="2"/>
      <rect x="365" y="25" width="35" height="30" rx="2"/>
      <rect x="410" y="25" width="35" height="30" rx="2"/>
    </g>
    
    <!-- Linear rounds 9-15 -->
    <g fill="#cba6f7">
      <rect x="460" y="25" width="35" height="30" rx="2"/>
      <rect x="505" y="25" width="35" height="30" rx="2"/>
      <rect x="550" y="25" width="35" height="30" rx="2"/>
      <rect x="595" y="25" width="35" height="30" rx="2"/>
      <rect x="640" y="25" width="35" height="30" rx="2"/>
      <rect x="685" y="25" width="35" height="30" rx="2"/>
      <rect x="730" y="25" width="35" height="30" rx="2"/>
    </g>
    
    <!-- Round numbers -->
    <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e1e2e" text-anchor="middle">
      <!-- Streaming rounds -->
      <text x="37" y="45">0</text>
      <text x="82" y="45">1</text>
      <text x="127" y="45">2</text>
      
      <text x="187" y="45">3</text>
      <text x="232" y="45">4</text>
      <text x="277" y="45">5</text>
      
      <text x="337" y="45">6</text>
      <text x="382" y="45">7</text>
      <text x="427" y="45">8</text>
      
      <!-- Linear rounds -->
      <text x="477" y="45">9</text>
      <text x="522" y="45">10</text>
      <text x="567" y="45">11</text>
      <text x="612" y="45">12</text>
      <text x="657" y="45">13</text>
      <text x="702" y="45">14</text>
      <text x="747" y="45">15</text>
    </g>
    
    <!-- Phase labels -->
    <text x="225" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#89b4fa">
      Streaming Phase
    </text>
    <text x="225" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#a6adc8">
      (Rounds 0-8)
    </text>
    
    <text x="612" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#cba6f7">
      Linear Phase
    </text>
    <text x="612" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#a6adc8">
      (Rounds 9-15)
    </text>
    
    <!-- Window labels -->
    <text x="80" y="-5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#89b4fa">
      Window 1
    </text>
    <text x="230" y="-5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#94e2d5">
      Window 2
    </text>
    <text x="375" y="-5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#a6e3a1">
      Window 3
    </text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 230)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">
      Legend:
    </text>
    
    <rect x="80" y="-12" width="20" height="15" fill="#f9e2af" rx="2"/>
    <text x="110" y="0" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
      Streaming rounds (windowed processing)
    </text>
    
    <rect x="350" y="-12" width="20" height="15" fill="#cba6f7" rx="2"/>
    <text x="380" y="0" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
      Linear rounds (sequential processing)
    </text>
    
    <rect x="80" y="13" width="20" height="15" fill="none" stroke="#89b4fa" stroke-width="2" rx="2"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
      Streaming windows (size = 3 rounds)
    </text>
  </g>
</svg>
