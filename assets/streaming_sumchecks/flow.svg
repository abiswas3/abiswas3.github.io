<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#1e1e2e"/>
  
  <!-- Title -->
  <text x="500" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#cdd6f4">
    Streaming Windows and Linear Phase Algorithm
  </text>
  
  <!-- Streaming Window Section -->
  <g transform="translate(50, 60)">
    <!-- Window Container -->
    <rect x="0" y="0" width="400" height="480" fill="#313244" stroke="#585b70" stroke-width="2" rx="5"/>
    
    <text x="200" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#89b4fa">
      Streaming Window (width w = 3)
    </text>
    
    <!-- Step 1: Initialize -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="360" height="70" fill="#45475a" stroke="#89b4fa" stroke-width="2" rx="5"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f9e2af">
        1. Start of Window (round i)
      </text>
      <text x="20" y="40" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        Re-stream trace → Generate t(X₁, X₂, X₃)
      </text>
      <text x="20" y="58" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
        Space: W = 2³ = 8 field elements
      </text>
    </g>
    
    <!-- Step 2: Compute messages -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="360" height="50" fill="#45475a" stroke="#94e2d5" stroke-width="2" rx="5"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f9e2af">
        2. Compute Prover Messages
      </text>
      <text x="20" y="38" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        Use t to compute all sum-check messages for window
      </text>
    </g>
    
    <!-- Round progression -->
    <g transform="translate(20, 190)">
      <!-- Round i -->
      <rect x="0" y="0" width="360" height="60" fill="#45475a" stroke="#a6e3a1" stroke-width="2" rx="5"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f9e2af">
        3. Round i: t(X₁, X₂, X₃) → size = 8
      </text>
      <text x="20" y="38" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        Receive r₀ → Evaluate X₁ = r₀
      </text>
      <text x="20" y="52" font-family="Arial, sans-serif" font-size="12" fill="#f38ba8">
        Shrink: t(r₀, X₂, X₃) → size = 4
      </text>
      
      <!-- Arrow -->
      <path d="M 180 60 L 180 75" stroke="#cba6f7" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- Round i+1 -->
    <g transform="translate(20, 265)">
      <rect x="0" y="0" width="360" height="60" fill="#45475a" stroke="#a6e3a1" stroke-width="2" rx="5"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f9e2af">
        4. Round i+1: t(r₀, X₂, X₃) → size = 4
      </text>
      <text x="20" y="38" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        Receive r₁ → Evaluate X₂ = r₁
      </text>
      <text x="20" y="52" font-family="Arial, sans-serif" font-size="12" fill="#f38ba8">
        Shrink: t(r₀, r₁, X₃) → size = 2
      </text>
      
      <!-- Arrow -->
      <path d="M 180 60 L 180 75" stroke="#cba6f7" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- Round i+2 (last) -->
    <g transform="translate(20, 340)">
      <rect x="0" y="0" width="360" height="60" fill="#45475a" stroke="#a6e3a1" stroke-width="2" rx="5"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f9e2af">
        5. Round i+2: t(r₀, r₁, X₃) → size = 2
      </text>
      <text x="20" y="38" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        Receive r₂ → Evaluate X₃ = r₂
      </text>
      <text x="20" y="52" font-family="Arial, sans-serif" font-size="12" fill="#f38ba8">
        Final: t(r₀, r₁, r₂) → size = 1
      </text>
    </g>
    
    <!-- Decision -->
    <g transform="translate(20, 410)">
      <rect x="0" y="0" width="360" height="50" fill="#585b70" stroke="#fab387" stroke-width="2" rx="5" stroke-dasharray="5,5"/>
      <text x="180" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fab387">
        Decision Point
      </text>
      <text x="180" y="38" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#cdd6f4">
        Next window? → Repeat | Linear phase? → Continue
      </text>
    </g>
  </g>
  
  <!-- Linear Phase Section -->
  <g transform="translate(500, 60)">
    <!-- Linear Container -->
    <rect x="0" y="0" width="450" height="480" fill="#313244" stroke="#585b70" stroke-width="2" rx="5"/>
    
    <text x="225" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#cba6f7">
      Linear Phase (rounds 9-15)
    </text>
    
    <!-- Initialize Linear -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="410" height="90" fill="#45475a" stroke="#cba6f7" stroke-width="2" rx="5"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f9e2af">
        Start of Linear Phase (round i = 9)
      </text>
      <text x="20" y="40" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        Stream trace → Store Ã(X₁₅, X₁₄, ..., X₉, 
      </text>
      <text x="190" y="40" font-family="Arial, sans-serif" font-size="12" fill="#fab387">
        r₈, r₇, ..., r₀
      </text>
      <text x="280" y="40" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        )
      </text>
      <text x="20" y="58" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
        Space: 2⁷ = 128 field elements (< 2^w for larger windows)
      </text>
      <text x="20" y="76" font-family="Arial, sans-serif" font-size="12" fill="#94e2d5">
        Fixed challenges from streaming phase: r₀ through r₈
      </text>
    </g>
    
    <!-- Linear Round Processing -->
    <g transform="translate(20, 150)">
      <text x="10" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f9e2af">
        Linear Round Processing:
      </text>
    </g>
    
    <!-- Example rounds -->
    <g transform="translate(20, 170)">
      <rect x="0" y="0" width="410" height="45" fill="#45475a" stroke="#f5c2e7" stroke-width="1" rx="3"/>
      <text x="10" y="18" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        Round 9: Ã(X₁₅, ..., X₉, 
      </text>
      <text x="150" y="18" font-family="Arial, sans-serif" font-size="12" fill="#fab387">
        r₈, ..., r₀
      </text>
      <text x="210" y="18" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        ) → receive r₉
      </text>
      <text x="10" y="33" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
        Update: Ã(X₁₅, ..., X₁₀, 
      </text>
      <text x="150" y="33" font-family="Arial, sans-serif" font-size="12" fill="#fab387">
        r₉, r₈, ..., r₀
      </text>
      <text x="240" y="33" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
        )
      </text>
    </g>
    
    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="410" height="45" fill="#45475a" stroke="#f5c2e7" stroke-width="1" rx="3"/>
      <text x="10" y="18" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        Round 10: Ã(X₁₅, ..., X₁₀, 
      </text>
      <text x="160" y="18" font-family="Arial, sans-serif" font-size="12" fill="#fab387">
        r₉, ..., r₀
      </text>
      <text x="220" y="18" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        ) → receive r₁₀
      </text>
      <text x="10" y="33" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
        Update: Ã(X₁₅, ..., X₁₁, 
      </text>
      <text x="150" y="33" font-family="Arial, sans-serif" font-size="12" fill="#fab387">
        r₁₀, r₉, ..., r₀
      </text>
      <text x="250" y="33" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
        )
      </text>
    </g>
    
    <!-- Dots for continuation -->
    <text x="225" y="295" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#585b70">
      ⋮
    </text>
    
    <g transform="translate(20, 315)">
      <rect x="0" y="0" width="410" height="45" fill="#45475a" stroke="#f5c2e7" stroke-width="1" rx="3"/>
      <text x="10" y="18" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        Round 15: Ã(X₁₅, 
      </text>
      <text x="100" y="18" font-family="Arial, sans-serif" font-size="12" fill="#fab387">
        r₁₄, ..., r₀
      </text>
      <text x="180" y="18" font-family="Arial, sans-serif" font-size="12" fill="#cdd6f4">
        ) → receive r₁₅
      </text>
      <text x="10" y="33" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
        Final: Ã(
      </text>
      <text x="60" y="33" font-family="Arial, sans-serif" font-size="12" fill="#fab387">
        r₁₅, r₁₄, ..., r₀
      </text>
      <text x="170" y="33" font-family="Arial, sans-serif" font-size="12" fill="#a6adc8">
        ) = constant
      </text>
    </g>
    
    <!-- Key insight -->
    <g transform="translate(20, 375)">
      <rect x="0" y="0" width="410" height="85" fill="#585b70" stroke="#a6e3a1" stroke-width="2" rx="5"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">
        Key Insight:
      </text>
      <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#cdd6f4">
        • Streaming windows: Trade computation for space (2^w)
      </text>
      <text x="20" y="56" font-family="Arial, sans-serif" font-size="11" fill="#cdd6f4">
        • Linear phase: Sequential processing with less space
      </text>
      <text x="20" y="72" font-family="Arial, sans-serif" font-size="11" fill="#cdd6f4">
        • Total space bounded by max(2^w, 2^{m-i}) where i is linear start
      </text>
    </g>
  </g>
  
  <!-- Space Complexity Visualization -->
  <g transform="translate(50, 560)">
    <rect x="0" y="0" width="900" height="120" fill="#313244" stroke="#585b70" stroke-width="2" rx="5"/>
    
    <text x="450" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#cdd6f4">
      Space Requirements Over Time
    </text>
    
    <!-- Graph -->
    <g transform="translate(50, 40)">
      <!-- Axis -->
      <line x1="0" y1="60" x2="800" y2="60" stroke="#585b70" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#585b70" stroke-width="2"/>
      
      <!-- Streaming windows space (constant within window) -->
      <rect x="0" y="35" width="150" height="25" fill="#89b4fa" fill-opacity="0.5"/>
      <rect x="150" y="35" width="150" height="25" fill="#94e2d5" fill-opacity="0.5"/>
      <rect x="300" y="35" width="150" height="25" fill="#a6e3a1" fill-opacity="0.5"/>
      
      <!-- Linear phase space (decreasing) -->
      <path d="M 450 20 L 500 22 L 550 26 L 600 32 L 650 40 L 700 50 L 750 58 L 800 60" 
            stroke="#cba6f7" stroke-width="2" fill="none"/>
      <rect x="450" y="20" width="350" height="40" fill="#cba6f7" fill-opacity="0.2"/>
      
      <!-- Labels -->
      <text x="75" y="50" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1e1e2e">
        2³
      </text>
      <text x="225" y="50" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1e1e2e">
        2³
      </text>
      <text x="375" y="50" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1e1e2e">
        2³
      </text>
      <text x="625" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#cba6f7">
        2⁷ → ... → 1
      </text>
      
      <!-- Round markers -->
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="9" fill="#a6adc8">0</text>
      <text x="150" y="75" font-family="Arial, sans-serif" font-size="9" fill="#a6adc8">3</text>
      <text x="300" y="75" font-family="Arial, sans-serif" font-size="9" fill="#a6adc8">6</text>
      <text x="450" y="75" font-family="Arial, sans-serif" font-size="9" fill="#a6adc8">9</text>
      <text x="800" y="75" font-family="Arial, sans-serif" font-size="9" fill="#a6adc8">15</text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#cba6f7"/>
    </marker>
  </defs>
</svg>
