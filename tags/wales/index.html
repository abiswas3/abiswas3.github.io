  <script>
    document.querySelectorAll('pre').forEach(function (pre) {
      if (!pre.querySelector('code')) return;
      var button = document.createElement('button');
      button.className = 'copy-code';
      button.type = 'button';
      button.textContent = 'Copy';
      button.addEventListener('click', function () {
        var clone = pre.querySelector('code').cloneNode(true);
        clone.querySelectorAll('.giallo-ln').forEach(function (line) { line.remove(); });
        navigator.clipboard.writeText(clone.textContent).then(function () {
          button.textContent = 'Copied';
          window.setTimeout(function () { button.textContent = 'Copy'; }, 1400);
        });
      });
      pre.appendChild(button);
    });
  </script>
  <script>
    document.addEventListener('click', function (event) {
      var back = event.target.closest('.bib-back');
      if (back) {
        event.preventDefault();
        var source = document.getElementById(back.getAttribute('data-source'));
        if (source) source.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      var link = event.target.closest('a.citation[href^="#ref-"]');
      if (!link) return;

      event.preventDefault();
      document.querySelectorAll('.citation-highlight').forEach(function (item) {
        item.classList.remove('citation-highlight');
      });
      document.querySelectorAll('.bib-back').forEach(function (item) { item.remove(); });

      var target = document.getElementById(decodeURIComponent(link.getAttribute('href').slice(1)));
      if (!target) return;

      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.add('citation-highlight');

      if (!link.id) link.id = 'cite-source-' + target.id;
      var arrow = document.createElement('a');
      arrow.className = 'bib-back';
      arrow.setAttribute('data-source', link.id);
      arrow.setAttribute('href', '#' + link.id);
      arrow.setAttribute('aria-label', 'Back to citation');
      arrow.textContent = ' ↩';
      target.appendChild(arrow);
    });
  </script>
