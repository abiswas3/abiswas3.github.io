  <!-- ====================================================================
       TUFTE SIDENOTES JS
       Transforms Zola's standard footnote HTML into Tufte-style sidenotes.
       Paired with the "TUFTE SIDENOTES" section in sass/style.scss.

       WHAT IT DOES:
         1. Finds every <sup class="footnote-reference"> in .post-content
         2. Looks up the matching <div class="footnote-definition" id="...">
            at the bottom of the page (Zola generates these from [^n] syntax)
         3. Extracts the footnote body (skipping the <sup> label Zola adds)
         4. Replaces the original <sup> reference with:
              <label class="sidenote-number" for="sn-N">  (the superscript number)
              <input type="checkbox" class="sidenote-toggle" id="sn-N">  (mobile toggle)
              <span class="sidenote">N. footnote body...</span>  (the actual note)
         5. Adds .footnotes-are-sidenotes to .post-content so CSS hides the
            original footnote definitions and their <hr> separator
         6. Also explicitly hides the <hr> before footnote defs via JS as a
            belt-and-suspenders measure

       IF YOU CHANGE --max-width in style.scss:
         The 1020px breakpoint in the CSS assumes 680px content + 240px margin +
         some padding. Recalculate if you widen the content column.

       IF JS FAILS:
         The original Zola footnotes remain untouched. The fallback CSS in
         style.scss styles them with superscript links — nothing breaks.
  ==================================================================== -->
  <script>
    (function() {
      var content = document.querySelector('.post-content');
      if (!content) return;

      var refs = content.querySelectorAll('.footnote-reference');
      if (!refs.length) return;

      content.classList.add('footnotes-are-sidenotes');
      var count = 0;

      refs.forEach(function(ref) {
        var link = ref.querySelector('a');
        if (!link) return;

        var href = link.getAttribute('href');
        if (!href) return;
        var id = href.replace('#', '');
        var def = content.querySelector('.footnote-definition#' + CSS.escape(id));
        if (!def) return;

        count++;

        // Get footnote body (skip the label <sup>)
        var body = '';
        var children = def.children;
        for (var i = 0; i < children.length; i++) {
          if (children[i].tagName !== 'SUP') {
            body += children[i].outerHTML;
          }
        }

        // Build sidenote elements:
        //   label  -> displays the superscript number, acts as <label> for the checkbox
        //   toggle -> hidden checkbox, checked state controls sidenote visibility on mobile
        //   note   -> the sidenote content itself
        var label = document.createElement('label');
        label.className = 'sidenote-number';
        label.setAttribute('for', 'sn-' + count);

        var toggle = document.createElement('input');
        toggle.type = 'checkbox';
        toggle.className = 'sidenote-toggle';
        toggle.id = 'sn-' + count;

        var note = document.createElement('span');
        note.className = 'sidenote';
        note.innerHTML = '<span class="sidenote-num">' + count + '</span> ' + body;

        // Replace the original footnote reference with our sidenote trio
        ref.replaceWith(label);
        label.after(note);
        label.after(toggle);
      });

      // Hide <hr> before footnote definitions (Zola inserts one as a separator)
      var firstDef = content.querySelector('.footnote-definition');
      if (firstDef) {
        var prev = firstDef.previousElementSibling;
        if (prev && prev.tagName === 'HR') {
          prev.style.display = 'none';
        }
      }
    })();
  </script>
  <script>
    // Code copy button
    document.querySelectorAll('.post-content pre').forEach(function(pre) {
      var wrapper = document.createElement('div');
      wrapper.className = 'code-block';
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(pre);

      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', function() {
        var code = pre.querySelector('code');
        var text = (code || pre).textContent;
        navigator.clipboard.writeText(text).then(function() {
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(function() {
            btn.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 2000);
        });
      });
      wrapper.appendChild(btn);
    });
  </script>
  <script>
    (function() {
      const select = document.getElementById('theme-select');
      const html = document.documentElement;
      const darkLink = document.getElementById('giallo-dark');
      const lightLink = document.getElementById('giallo-light');

      const lightThemes = ['rose-pine-dawn', 'bw-light'];

      function setTheme(theme) {
        html.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        if (select) select.value = theme;
        if (lightThemes.includes(theme)) {
          lightLink.media = 'all';
          darkLink.media = 'not all';
        } else {
          darkLink.media = 'all';
          lightLink.media = 'not all';
        }
      }

      // Apply current theme (already set by head script, but sync CSS)
      const current = html.getAttribute('data-theme');
      setTheme(current);

      if (select) {
        select.addEventListener('change', function() {
          setTheme(select.value);
        });
      }
    })();
  </script>
