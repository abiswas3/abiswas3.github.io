<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-label="A graph on vertices v, w, x, y, z with the clique w, x, y, z highlighted">
  <style>
    .e { stroke: #9ca3af; stroke-width: 2.5; }
    .eh { stroke: #ea580c; stroke-width: 4.5; }
    .v { fill: #ffffff; stroke: #4b5563; stroke-width: 2; }
    .vh { fill: #fdba74; stroke: #c2410c; stroke-width: 2.5; }
    .lbl { fill: #111827; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
  </style>
  <g>
    <line class="e" x1="210" y1="45" x2="310" y2="110"/>
    <line class="e" x1="210" y1="175" x2="310" y2="110"/>
  </g>
  <g>
    <line class="eh" x1="90" y1="45" x2="210" y2="45"/>
    <line class="eh" x1="90" y1="45" x2="210" y2="175"/>
    <line class="eh" x1="90" y1="45" x2="90" y2="175"/>
    <line class="eh" x1="210" y1="45" x2="210" y2="175"/>
    <line class="eh" x1="210" y1="45" x2="90" y2="175"/>
    <line class="eh" x1="210" y1="175" x2="90" y2="175"/>
  </g>
  <g>
    <circle class="vh" cx="90" cy="45" r="17"/><text class="lbl" x="90" y="45">w</text>
    <circle class="vh" cx="210" cy="45" r="17"/><text class="lbl" x="210" y="45">x</text>
    <circle class="vh" cx="210" cy="175" r="17"/><text class="lbl" x="210" y="175">y</text>
    <circle class="vh" cx="90" cy="175" r="17"/><text class="lbl" x="90" y="175">z</text>
    <circle class="v" cx="310" cy="110" r="17"/><text class="lbl" x="310" y="110">v</text>
  </g>
</svg>
