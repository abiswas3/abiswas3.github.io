<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="320" height="230" role="img" aria-label="A graph on vertices a to e with the Rudrata cycle a, b, c, e, d, a highlighted">
  <style>
    .e { stroke: #9ca3af; stroke-width: 2.5; }
    .eh { stroke: #ea580c; stroke-width: 4.5; }
    .v { fill: #ffffff; stroke: #4b5563; stroke-width: 2; }
    .lbl { fill: #111827; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
  </style>
  <g>
    <line class="e" x1="220" y1="100" x2="100" y2="100"/>
    <line class="e" x1="100" y1="190" x2="220" y2="100"/>
  </g>
  <g>
    <line class="eh" x1="100" y1="190" x2="220" y2="190"/>
    <line class="eh" x1="220" y1="190" x2="220" y2="100"/>
    <line class="eh" x1="220" y1="100" x2="160" y2="35"/>
    <line class="eh" x1="160" y1="35" x2="100" y2="100"/>
    <line class="eh" x1="100" y1="100" x2="100" y2="190"/>
  </g>
  <g>
    <circle class="v" cx="100" cy="190" r="17"/><text class="lbl" x="100" y="190">a</text>
    <circle class="v" cx="220" cy="190" r="17"/><text class="lbl" x="220" y="190">b</text>
    <circle class="v" cx="220" cy="100" r="17"/><text class="lbl" x="220" y="100">c</text>
    <circle class="v" cx="100" cy="100" r="17"/><text class="lbl" x="100" y="100">d</text>
    <circle class="v" cx="160" cy="35" r="17"/><text class="lbl" x="160" y="35">e</text>
  </g>
</svg>
