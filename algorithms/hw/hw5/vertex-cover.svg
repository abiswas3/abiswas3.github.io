<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-label="A graph on vertices p, q, r, s, t with the vertex cover p, q, s highlighted">
  <style>
    .e { stroke: #9ca3af; stroke-width: 2.5; }
    .v { fill: #ffffff; stroke: #4b5563; stroke-width: 2; }
    .vh { fill: #fdba74; stroke: #c2410c; stroke-width: 2.5; }
    .lbl { fill: #111827; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
  </style>
  <g>
    <line class="e" x1="170" y1="110" x2="100" y2="45"/>
    <line class="e" x1="170" y1="110" x2="100" y2="175"/>
    <line class="e" x1="170" y1="110" x2="250" y2="110"/>
    <line class="e" x1="100" y1="45" x2="100" y2="175"/>
    <line class="e" x1="250" y1="110" x2="320" y2="110"/>
  </g>
  <g>
    <circle class="vh" cx="170" cy="110" r="17"/><text class="lbl" x="170" y="110">p</text>
    <circle class="vh" cx="100" cy="45" r="17"/><text class="lbl" x="100" y="45">q</text>
    <circle class="v" cx="100" cy="175" r="17"/><text class="lbl" x="100" y="175">r</text>
    <circle class="vh" cx="250" cy="110" r="17"/><text class="lbl" x="250" y="110">s</text>
    <circle class="v" cx="320" cy="110" r="17"/><text class="lbl" x="320" y="110">t</text>
  </g>
</svg>
