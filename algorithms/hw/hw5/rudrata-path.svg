<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="A graph on vertices s, a, b, c, d, t with the Rudrata (s,t)-path s, c, d, a, b, t highlighted">
  <style>
    .e { stroke: #9ca3af; stroke-width: 2.5; }
    .eh { stroke: #ea580c; stroke-width: 4.5; }
    .v { fill: #ffffff; stroke: #4b5563; stroke-width: 2; }
    .lbl { fill: #111827; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
  </style>
  <g>
    <line class="e" x1="60" y1="50" x2="160" y2="50"/>
    <line class="e" x1="160" y1="170" x2="260" y2="170"/>
  </g>
  <g>
    <line class="eh" x1="60" y1="50" x2="60" y2="170"/>
    <line class="eh" x1="60" y1="170" x2="160" y2="170"/>
    <line class="eh" x1="160" y1="170" x2="160" y2="50"/>
    <line class="eh" x1="160" y1="50" x2="260" y2="50"/>
    <line class="eh" x1="260" y1="50" x2="260" y2="170"/>
  </g>
  <g>
    <circle class="v" cx="60" cy="50" r="17"/><text class="lbl" x="60" y="50">s</text>
    <circle class="v" cx="160" cy="50" r="17"/><text class="lbl" x="160" y="50">a</text>
    <circle class="v" cx="260" cy="50" r="17"/><text class="lbl" x="260" y="50">b</text>
    <circle class="v" cx="60" cy="170" r="17"/><text class="lbl" x="60" y="170">c</text>
    <circle class="v" cx="160" cy="170" r="17"/><text class="lbl" x="160" y="170">d</text>
    <circle class="v" cx="260" cy="170" r="17"/><text class="lbl" x="260" y="170">t</text>
  </g>
</svg>
