<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-label="A graph on vertices a to f with the independent set a, c, e highlighted">
  <style>
    .e { stroke: #9ca3af; stroke-width: 2.5; }
    .v { fill: #ffffff; stroke: #4b5563; stroke-width: 2; }
    .vh { fill: #fdba74; stroke: #c2410c; stroke-width: 2.5; }
    .lbl { fill: #111827; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
  </style>
  <g>
    <line class="e" x1="100" y1="110" x2="140" y2="40"/>
    <line class="e" x1="140" y1="40" x2="220" y2="40"/>
    <line class="e" x1="220" y1="40" x2="260" y2="110"/>
    <line class="e" x1="260" y1="110" x2="220" y2="180"/>
    <line class="e" x1="220" y1="180" x2="140" y2="180"/>
    <line class="e" x1="140" y1="180" x2="100" y2="110"/>
    <line class="e" x1="140" y1="40" x2="220" y2="180"/>
  </g>
  <g>
    <circle class="vh" cx="100" cy="110" r="17"/><text class="lbl" x="100" y="110">a</text>
    <circle class="v" cx="140" cy="40" r="17"/><text class="lbl" x="140" y="40">b</text>
    <circle class="vh" cx="220" cy="40" r="17"/><text class="lbl" x="220" y="40">c</text>
    <circle class="v" cx="260" cy="110" r="17"/><text class="lbl" x="260" y="110">d</text>
    <circle class="vh" cx="220" cy="180" r="17"/><text class="lbl" x="220" y="180">e</text>
    <circle class="v" cx="140" cy="180" r="17"/><text class="lbl" x="140" y="180">f</text>
  </g>
</svg>
