<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">Common growth rates</title>
  <desc id="description">A line chart comparing logarithmic, linear, and quadratic growth.</desc>
  <rect width="960" height="440" rx="18" fill="#25231f"/>
  <g stroke="#46413a" stroke-width="2">
    <path d="M96 52V354H886" fill="none"/>
    <path d="M96 278H886M96 202H886M96 126H886" opacity=".45"/>
  </g>
  <g fill="#b6afa4" font-family="Inter, system-ui, sans-serif" font-size="18">
