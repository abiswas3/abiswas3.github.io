<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-labelledby="title">
  <title id="title">Little omega: f(n) grows faster than g(n)</title>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 24V148H330" stroke="#aaa59c" stroke-width="1.5"/>
    <path d="M44 131 C120 130 204 119 310 35" stroke="#8ec7d2" stroke-width="3"/>
    <path d="M44 131L310 91" stroke="#edc784" stroke-width="3"/>
  </g>
  <g font-family="Georgia, serif" font-size="16" font-style="italic">
    <text x="311" y="34" fill="#8ec7d2">f(n)</text>
    <text x="313" y="96" fill="#edc784">g(n)</text>
    <text x="335" y="153" fill="#c7c1b7">n</text>
  </g>
  <text x="83" y="174" fill="#c7c1b7" font-family="Georgia, serif" font-size="15" font-style="italic">f(n) / g(n) → ∞</text>
</svg>
